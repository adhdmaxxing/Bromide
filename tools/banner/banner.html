<!doctype html>
<!-- Bromide banner. Open in Chrome with a size in the hash, e.g. banner.html#w=2400&h=867
     (feature graphic: #w=1024&h=500&size=0.27&x=0.055&grain=15), or render headless:
     chrome --headless=new --allow-file-access-from-files --window-size=2400,867 --screenshot=banner.jpg "file:///.../banner.html#w=2400&h=867"
     Font: TeX Gyre Heros (a Helvetica clone, GUST Font License), from CTAN. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Heros; src: url(texgyreheros-bold.otf); font-weight: 700; }
@font-face { font-family: Heros; src: url(texgyreheros-regular.otf); font-weight: 400; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// Params from the URL hash: w, h, seed, weight, size (text height / image height), x (left margin / width), grain
const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const W = +(q.w || 2400), H = +(q.h || 867), SEED = +(q.seed || 3);
const WEIGHT = q.weight || '400', SIZE = +(q.size || 0.38), X = +(q.x || 0.075), TEXT = q.text || 'bromide';
const GRAIN = +(q.grain || 22);

let s = SEED >>> 0;
const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.2247;

const c = document.getElementById('c');
c.width = W; c.height = H;
const ctx = c.getContext('2d');

function glow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * Math.max(W, H));
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

async function draw() {
  await document.fonts.load(`${WEIGHT} 100px Heros`);

  // Night shadows on color negative film: blue-black on top, sinking into green.
  const base = ctx.createLinearGradient(0, 0, W * 0.35, H);
  base.addColorStop(0, '#0a1d2e');
  base.addColorStop(0.55, '#0c2a33');
  base.addColorStop(1, '#0d3329');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);

  // Soft tonal drift, nothing that reads as a shape.
  ctx.globalCompositeOperation = 'screen';
  glow(0.78, 0.20, 0.50, '#1a5478', 0.65);  // blue
  glow(0.92, 0.95, 0.45, '#1d6648', 0.70);  // green
  glow(0.30, 0.95, 0.40, '#145058', 0.55);  // teal
  ctx.globalCompositeOperation = 'source-over';

  // The word is the light source. Halation: light goes through the emulsion, bounces off the
  // film base and comes back through the red-sensitive layer, so the glow hugs the letters in red-orange.
  const px = Math.round(H * SIZE);
  const u = px / 300;  // halation scales with the letters
  ctx.font = `${WEIGHT} ${px}px Heros`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${-0.04 * px}px`;
  const m = ctx.measureText(TEXT);
  const tx = W * X;
  const ty = H / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;

  ctx.globalCompositeOperation = 'lighter';
  const halo = [
    [150, '#a00c06', 0.75],
    [60, '#e01a0e', 0.95],
    [24, '#ff3014', 0.85],
    [8, '#ff5a22', 0.70],
    [3, '#ffb27a', 0.50],
  ];
  for (const [b, col, a] of halo) {
    ctx.save();
    ctx.filter = `blur(${b * u}px)`;
    ctx.globalAlpha = a;
    ctx.fillStyle = col;
    ctx.fillText(TEXT, tx, ty);
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff4e6';
  ctx.fillText(TEXT, tx, ty);

  // Gentle vignette.
  ctx.globalCompositeOperation = 'multiply';
  const v = ctx.createRadialGradient(W * 0.45, H / 2, H * 0.3, W * 0.45, H / 2, W * 0.7);
  v.addColorStop(0, '#ffffff');
  v.addColorStop(1, '#8a9090');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // Grain: fine noise plus a clumped layer; colored in the shadows, like a pushed color negative.
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const cw = Math.ceil(W / 3) + 1, ch = Math.ceil(H / 3) + 1;
  const clump = new Float32Array(cw * ch);
  for (let i = 0; i < clump.length; i++) clump[i] = gauss();
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const l = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
      const mid = 0.55 + 2.0 * l * (1 - l);
      const g = (gauss() * 0.75 + clump[((y / 3) | 0) * cw + ((x / 3) | 0)] * 0.55) * GRAIN * mid;
      const chroma = 9 * (1.2 - l);
      d[i]     = d[i]     + g + gauss() * chroma;
      d[i + 1] = d[i + 1] + g + gauss() * chroma;
      d[i + 2] = d[i + 2] + g + gauss() * chroma * 1.2;
    }
  }
  ctx.putImageData(img, 0, 0);
  document.title = 'done';
}
draw();
</script></body></html>
